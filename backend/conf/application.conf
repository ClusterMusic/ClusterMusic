
# Supplied via the APPLICATION_SECRET environment variable (see .env.example).
# "changeme" is a dev-only placeholder; Play refuses to start in prod mode with it.
play.http.secret.key = "changeme"
play.http.secret.key = ${?APPLICATION_SECRET}

play.modules.enabled += "modules.ApplicationModule"

app {

  database {
    thread-pool {
      size = 20
      size = ${?DATABASE_THREAD_POOL_SIZE}
    }
  }
  

  blocking {
    thread-pool {
      size = 32
      size = ${?BLOCKING_THREAD_POOL_SIZE}
    }
  }
  

  cpu-intensive {
    thread-pool {
      size = 4
      size = ${?CPU_INTENSIVE_THREAD_POOL_SIZE}
    }
  }


  seedOnStartup = true
  seedOnStartup = ${?APP_SEED_ON_STARTUP}
}

mongodb {
  uri = "mongodb://localhost:27017"
  uri = ${?MONGO_URI}
}

slick.dbs.default {
  profile = "slick.jdbc.MySQLProfile$"
  db {
    driver = "com.mysql.cj.jdbc.Driver"
    url = "jdbc:mysql://localhost:3306/cluster_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    url = ${?DATABASE_URL}
    user = "root"
    user = ${?DATABASE_USER}
    password = ""
    password = ${?DATABASE_PASSWORD}
  }
}

play.filters {
  enabled += "play.filters.cors.CORSFilter"
  enabled += "play.filters.csrf.CSRFFilter"
  cors {
    pathPrefixes = ["/"]
    allowedOrigins = null
    allowedHttpMethods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowedHttpHeaders = ["Accept", "Content-Type", "Origin", "Authorization", "User"]
  }
}

play.filters.hosts {
  allowed = ["."]
}
