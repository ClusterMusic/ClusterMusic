@(rooms: Seq[chat.ChatRoom])(implicit request: RequestHeader)

@main("Chat Rooms") {
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1>Chat Rooms</h1>
                    <button class="btn btn-primary" id="create-room-btn">
                        <i class="fas fa-plus"></i> Create New Room
                    </button>
                </div>

                <div class="row" id="rooms-container">
                    @for(room <- rooms) {
                        <div class="col-md-4 mb-3">
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title">Room #@room.id</h5>
                                    <p class="card-text">
                                        <i class="fas fa-users"></i> @room.members.length members
                                    </p>
                                    <a href="/chat/room/@room." class="btn btn-primary btn-sm">
                                        <i class="fas fa-sign-in-alt"></i> Join Room
                                    </a>
                                    <button class="btn btn-danger btn-sm delete-room" data-room-id="@room.id">
                                        <i class="fas fa-trash"></i> Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                    }
                </div>

                @if(rooms.isEmpty) {
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i> No chat rooms available. Create one to get started!
                    </div>
                }
            </div>
        </div>
    </div>

    
    <div class="modal fade" id="createRoomModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create New Chat Room</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="create-room-form">
                        <div class="mb-3">
                            <label for="room-name" class="form-label">Room Name (optional)</label>
                            <input type="text" class="form-control" id="room-name" placeholder="Enter room name">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="confirm-create-room">Create Room</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            loadChatRooms();
            
            $('#create-room-btn').click(function() {
                $('#createRoomModal').modal('show');
            });

            $('#confirm-create-room').click(function() {
                $.ajax({
                    url: '/chat/rooms',
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + auth.getAccessToken(),
                        'User': auth.getUserId(),
                        'Content-Type': 'application/json'
                    },
                    data: JSON.stringify({}),
                    success: function(response) {
                        $('#createRoomModal').modal('hide');
                        loadChatRooms();
                        utils.showNotification('Room created successfully!', 'success');
                    },
                    error: function(xhr) {
                        const error = xhr.responseJSON ? xhr.responseJSON.error : 'Error creating room';
                        utils.showNotification(error, 'danger');
                    }
                });
            });

            $(document).on('click', '.delete-room', function() {
                const roomId = $(this).data('room-id');
                if(confirm('Are you sure you want to delete this room?')) {
                    $.ajax({
                        url: '/chat/rooms/' + roomId,
                        method: 'DELETE',
                        headers: {
                            'Authorization': 'Bearer ' + auth.getAccessToken(),
                            'User': auth.getUserId()
                        },
                        success: function(response) {
                            loadChatRooms();
                            utils.showNotification('Room deleted successfully!', 'success');
                        },
                        error: function(xhr) {
                            const error = xhr.responseJSON ? xhr.responseJSON.error : 'Error deleting room';
                            utils.showNotification(error, 'danger');
                        }
                    });
                }
            });
        });

        function loadChatRooms() {
            $.ajax({
                url: '/chat/rooms',
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + auth.getAccessToken(),
                    'User': auth.getUserId(),
                    'Accept': 'application/json'
                },
                success: function(rooms) {
                    renderRooms(rooms);
                },
                error: function(xhr) {
                    const error = xhr.responseJSON ? xhr.responseJSON.error : 'Error loading rooms';
                    utils.showNotification(error, 'danger');
                }
            });
        }

        function renderRooms(rooms) {
            const roomsContainer = $('#rooms-container');
            roomsContainer.empty();

            if (rooms.length === 0) {
                roomsContainer.html(`
                    <div class="col-12">
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle"></i> No chat rooms available. Create one to get started!
                        </div>
                    </div>
                `);
                return;
            }

            rooms.forEach(function(room) {
                const roomCard = `
                    <div class="col-md-4 mb-3">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Room #${room.id}</h5>
                                <p class="card-text">
                                    <i class="fas fa-users"></i> ${room.members ? room.members.length : 0} members
                                </p>
                                <a href="/chat/room/${room.id}" class="btn btn-primary btn-sm">
                                    <i class="fas fa-sign-in-alt"></i> Join Room
                                </a>
                                <button class="btn btn-danger btn-sm delete-room" data-room-id="${room.id}">
                                    <i class="fas fa-trash"></i> Delete
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                roomsContainer.append(roomCard);
            });
        }
    </script>
}
